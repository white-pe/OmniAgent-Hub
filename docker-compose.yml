services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PAWTEAM_ENVIRONMENT: docker
      PAWTEAM_HOST: 0.0.0.0
      PAWTEAM_DATABASE_URL: sqlite+aiosqlite:////app/data/app.db
      PAWTEAM_DATA_DIR: /app/data
      PAWTEAM_SECRETS_DIR: /app/data/secrets
      PAWTEAM_WORKSPACES_DIR: /app/data/workspaces
    volumes:
      - pawteam-data:/app/data
    expose:
      - "8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8080:80"

volumes:
  pawteam-data:
