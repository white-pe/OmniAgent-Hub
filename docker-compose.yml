services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PAWTEAM_ENVIRONMENT: docker
      PAWTEAM_HOST: 0.0.0.0
      PAWTEAM_DATABASE_URL: sqlite+aiosqlite:////app/data/app.db
      PAWTEAM_DATA_DIR: /app/data
      PAWTEAM_SECRETS_DIR: /app/data/secrets
      PAWTEAM_WORKSPACES_DIR: /app/data/workspaces
      PAWTEAM_BLUEPRINT_TTL_MINUTES: 1440
      PAWTEAM_RUN_TIMEOUT_SECONDS: 120
    volumes:
      - pawteam-data:/app/data
    expose:
      - "8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8080:80"

  qdrant:
    image: qdrant/qdrant:v1.20.0
    restart: unless-stopped
    # 仅本机开发访问。Qdrant 默认没有认证，不要绑定到 0.0.0.0。
    ports:
      - "127.0.0.1:6333:6333"
    # 即使容器被重建，向量数据仍保存在命名卷中。
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  pawteam-data:
  qdrant-data:
