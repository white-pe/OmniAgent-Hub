[project]
name = "pawteam-lite"
version = "0.8.2"
description = "A small, explainable multi-agent platform built step by step."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "aiosqlite>=0.21,<1",
    "alembic>=1.16,<2",
    "cryptography>=45,<47",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "pydantic-settings>=2.10,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "segno>=1.6,<2",
    "uvicorn[standard]>=0.35,<1",
    "wecom-aibot-python-sdk==1.0.2",
    "python-socks[asyncio]>=2.7,<3",
]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "backend/src"}

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
